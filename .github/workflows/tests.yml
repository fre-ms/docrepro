name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --dev --extra gui
      - if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4
          libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libdbus-1-3 libfontconfig1
      - run: uv run ruff check docrepro tests packaging
      # The orientation model is an optional download. Fetched here by docrepro's own command
      # (the only one that goes on the network) and kept between runs, so that the test of a
      # scan on its head runs too; where its address does not answer, it is skipped.
      - uses: actions/cache@v4
        with:
          path: models
          key: models-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - run: uv run docrepro models fetch page-orientation --to models
        continue-on-error: true
      - run: uv run pytest -v --timeout=600
        env:
          QT_QPA_PLATFORM: offscreen
          DOCREPRO_MODELS: models

  sidecar:
    name: standalone program (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --extra gui --group build
      - uses: actions/cache@v4
        with:
          path: models
          key: models-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - id: model
        run: uv run docrepro models fetch page-orientation --to models
        continue-on-error: true
      - run: >
          uv run python packaging/build.py
          ${{ steps.model.outcome == 'success' && '--models models' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: docrepro-aarch64-apple-darwin
          path: |
            dist/docrepro-aarch64-apple-darwin
            dist/docrepro-aarch64-apple-darwin.sha256
            dist/docrepro-aarch64-apple-darwin.licences.json
          retention-days: 14
