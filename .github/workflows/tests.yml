name: Tests

# One repository, six packages: doccor (the core), the four steps typdoc, optdoc, ocrdoc and
# tagdoc, and docrepro, which joins them. Each package is tested on its own, in its folder,
# on the state of the others that stands beside it.

on:
  push:
  pull_request:

jobs:
  lint:
    name: ruff and mypy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --all-packages --all-extras
      - run: >
          uv run --no-sync ruff check docrepro tests packaging
          packages/doccor/doccor packages/doccor/tests
          packages/typdoc/typdoc packages/typdoc/tests
          packages/optdoc/optdoc packages/optdoc/tests packages/optdoc/bench
          packages/ocrdoc/ocrdoc packages/ocrdoc/tests packages/ocrdoc/bench
          packages/tagdoc/tagdoc packages/tagdoc/tests
      - run: |
          for package in doccor typdoc optdoc ocrdoc tagdoc; do
            (cd packages/$package && uv run --no-sync mypy $package --ignore-missing-imports) || exit 1
          done
          uv run --no-sync mypy docrepro --ignore-missing-imports

  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
      # the orientation model, an optional download: fetched below by the one command that
      # goes on the network, and kept between runs; where its address does not answer, the
      # tests that need it are skipped
      OPTDOC_MODELS: ${{ github.workspace }}/models
      DOCREPRO_MODELS: ${{ github.workspace }}/models
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-deu
          libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4
          libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libdbus-1-3 libfontconfig1
      - run: uv sync --all-packages --all-extras
      - uses: actions/cache@v4
        with:
          path: models
          key: models-${{ runner.os }}-${{ hashFiles('packages/optdoc/optdoc/models.py') }}
      - run: uv run --no-sync docrepro models fetch page-orientation --to models
        continue-on-error: true
      - name: doccor
        working-directory: packages/doccor
        run: uv run --no-sync pytest -q --timeout=600
      - name: typdoc
        working-directory: packages/typdoc
        run: uv run --no-sync pytest -q --timeout=600
      - name: optdoc
        working-directory: packages/optdoc
        run: uv run --no-sync pytest -q --timeout=600 --durations=10
      - name: ocrdoc
        working-directory: packages/ocrdoc
        run: uv run --no-sync pytest -q --timeout=600 --durations=10
      - name: tagdoc
        working-directory: packages/tagdoc
        run: uv run --no-sync pytest -q --timeout=600
      - name: docrepro
        run: uv run --no-sync pytest -q --timeout=600

  sidecar:
    name: standalone program (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      # the packages installed as they would be from a release, not as links to the sources,
      # and nothing the tests alone need
      - run: uv sync --extra gui --group build --no-dev --no-editable
      - uses: actions/cache@v4
        with:
          path: models
          key: models-${{ runner.os }}-${{ hashFiles('packages/optdoc/optdoc/models.py') }}
      - id: model
        run: uv run --no-sync docrepro models fetch page-orientation --to models
        continue-on-error: true
      - run: >
          uv run --no-sync python packaging/build.py
          ${{ steps.model.outcome == 'success' && '--models models' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: docrepro-aarch64-apple-darwin
          path: |
            dist/docrepro-aarch64-apple-darwin
            dist/docrepro-aarch64-apple-darwin.sha256
            dist/docrepro-aarch64-apple-darwin.licences.json
          retention-days: 14
