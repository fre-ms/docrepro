[project]
name = "doccor"
version = "0.1.0"
description = "The shared core of the document tools optdoc, ocrdoc, semdoc and tagdoc: reproducible configuration documents, the command line's manners, no network, the window's building blocks."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "fre.ms", email = "fre.ms@fre.ms" }]
keywords = ["document", "pdf", "reproducible", "configuration", "offline"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]
dependencies = [
  # the tools' PDFs carry their configuration documents; <2 as in optdoc (PyMuPDF 2.0 shifts
  # glyphs after a redaction)
  "pymupdf>=1.25,<2",
]

[project.optional-dependencies]
gui = [
    "pyside6-essentials>=6.8",
]

[project.urls]
Source = "https://github.com/fre-ms/doccor"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-timeout>=2.3",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doccor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
timeout_method = "thread"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
