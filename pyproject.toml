[project]
name = "docrepro"
version = "0.1.0"
description = "Reproduces photographed and scanned documents as digital documents: optdoc and ocrdoc (and later semdoc and tagdoc) in one chain, one window and one program, every step reproducible."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
authors = [{ name = "fre.ms", email = "fre.ms@fre.ms" }]
keywords = ["scan", "photo", "document", "ocr", "pdf", "reproducible", "records"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Capture :: Scanners",
  "Topic :: Text Processing",
]
dependencies = [
  # the core the tools share: configuration documents, errors, the command line's manners,
  # no network, the window's building blocks
  "doccor>=0.1",
  # the steps; a step that is missing is left out of the chain and the window
  "optdoc[cleanup]>=0.7",
  "ocrdoc[ocr,tables,barcodes]>=0.1",
  # step 40; it joins through its entry point docrepro.steps
  "tagdoc>=0.1",
]

[project.optional-dependencies]
gui = ["optdoc[gui]>=0.7", "ocrdoc[gui]>=0.1", "tagdoc[gui]>=0.1"]

[tool.uv.sources]
doccor = { git = "https://github.com/fre-ms/doccor", tag = "v0.1.0" }
# released tags: docrepro moves to a new version of a step on purpose
optdoc = { git = "https://github.com/fre-ms/optdoc", tag = "v0.7.0" }
ocrdoc = { git = "https://github.com/fre-ms/ocrdoc", tag = "v0.1.0" }
# not tagged yet: this very commit of its repository
tagdoc = { git = "https://github.com/fre-ms/tagdoc", rev = "ae1c36b4979895ef4fda76ac89bed69855d92231" }

[project.scripts]
docrepro = "docrepro.cli:main"

[project.urls]
Source = "https://github.com/fre-ms/docrepro"

[dependency-groups]
build = [
    "pyinstaller>=6.11",
]
dev = [
  "pytest>=8",
  "pytest-timeout>=2.3",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docrepro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 900
timeout_method = "thread"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
